x-build-context: &build-context
  context: .

x-healthcheck-8000: &healthcheck-8000
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
  interval: 5s
  timeout: 5s
  retries: 10

x-depends-on-database: &depends-on-database
  database:
    condition: service_healthy

x-depends-on-database-and-rabbitmq: &depends-on-database-and-rabbitmq
  database:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

x-depends-on-database-and-redis: &depends-on-database-and-redis
  database:
    condition: service_healthy
  redis:
    condition: service_healthy

x-depends-on-database-rabbitmq-redis: &depends-on-database-rabbitmq-redis
  database:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  redis:
    condition: service_healthy

x-service-common: &service-common
  environment: &common-env
    DATABASE_SERVICE_URL: http://database:8005
    JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    REDIS_URL: redis://redis:6379/0
  depends_on: *depends-on-database
  healthcheck: *healthcheck-8000

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anonfeedback
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anonfeedback"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    build:
      context: infra/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    command: sh -c "rabbitmq-plugins enable rabbitmq_delayed_message_exchange --offline && rabbitmq-server"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  database:
    build:
      <<: *build-context
      dockerfile: backend/database/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/anonfeedback
    ports:
      - "8005:8005"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    <<: *service-common
    build:
      <<: *build-context
      dockerfile: backend/auth/Dockerfile
    env_file:
      - backend/auth/.env
    environment:
      <<: *common-env
    depends_on: *depends-on-database-and-redis
    ports:
      - "8004:8000"

  hospitals:
    <<: *service-common
    build:
      <<: *build-context
      dockerfile: backend/hospitals/Dockerfile
    ports:
      - "8006:8000"

  admin:
    <<: *service-common
    build:
      <<: *build-context
      dockerfile: backend/admin/Dockerfile
    environment:
      <<: *common-env
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on: *depends-on-database-and-rabbitmq
    ports:
      - "8007:8000"

  feedback:
    <<: *service-common
    build:
      <<: *build-context
      dockerfile: backend/feedback/Dockerfile
    environment:
      <<: *common-env
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      AUDIO_STORAGE_DIR: /data/audio
    depends_on: *depends-on-database-rabbitmq-redis
    volumes:
      - feedback_audio:/data/audio
    ports:
      - "8008:8000"

  notifications:
    <<: *service-common
    build:
      <<: *build-context
      dockerfile: backend/notifications/Dockerfile
    environment:
      <<: *common-env
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      PUSH_TTL_SECONDS: ${PUSH_TTL_SECONDS:-86400}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    depends_on: *depends-on-database-and-rabbitmq
    ports:
      - "8009:8000"

  payment:
    <<: *service-common
    build:
      <<: *build-context
      dockerfile: backend/payment/Dockerfile
    env_file:
      - backend/payment/.env
    environment:
      <<: *common-env
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:-http://localhost:8010/api/payments/success}
      PAYMENT_CANCEL_URL: ${PAYMENT_CANCEL_URL:-http://localhost:8010/api/payments/cancel}
      PAYMENT_DEMO_AMOUNT: ${PAYMENT_DEMO_AMOUNT:-2000}
      PAYMENT_DEMO_CURRENCY: ${PAYMENT_DEMO_CURRENCY:-usd}
    ports:
      - "8010:8000"

  ai:
    <<: *service-common
    build:
      <<: *build-context
      dockerfile: backend/ai/Dockerfile
    env_file:
      - backend/ai/.env
    environment:
      <<: *common-env
      LLM_BASE_URL: ${LLM_BASE_URL:-http://172.16.8.197:1234/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen}
      STT_BASE_URL: ${STT_BASE_URL:-https://service.muxlisa.uz/api/v1}
    ports:
      - "8011:8000"

  stt-worker:
    <<: *service-common
    build:
      <<: *build-context
      dockerfile: backend/stt-worker/Dockerfile
    env_file:
      - backend/ai/.env
    environment:
      <<: *common-env
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      AUDIO_STORAGE_DIR: /data/audio
      STT_BASE_URL: ${STT_BASE_URL:-https://service.muxlisa.uz/api/v1}
    depends_on: *depends-on-database-and-rabbitmq
    volumes:
      - feedback_audio:/data/audio:ro

volumes:
  db_data:
  feedback_audio:
