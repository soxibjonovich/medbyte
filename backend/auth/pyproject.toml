[project]
name = "anonfeedback"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    "fastapi>=0.141.1",
    "google-auth>=2.56.3",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/auth"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
