[project]
name = "database"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "soxibjonovich", email = "makhmud.dev09@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.0",
    "email-validator>=2.2.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "greenlet>=3.5.5",
    "alembic>=1.19.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
