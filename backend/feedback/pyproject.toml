[project]
name = "feedback"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "soxibjonovich", email = "makhmud.dev09@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=9.5.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pyjwt>=2.13.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.20",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
feedback = "feedback:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
