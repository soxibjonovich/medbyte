[project]
name = "user"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "soxibjonovich", email = "makhmud.dev09@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "pydantic>=2.13.4",
    "email-validator>=2.2.0",
]

[project.scripts]
user = "user:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
